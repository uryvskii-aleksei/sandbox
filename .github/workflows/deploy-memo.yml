name: Deploy Memo

on:
  workflow_dispatch:
  push:
    branches: [release/mind-assistant]

permissions:
  contents: write
  actions: read

concurrency:
  group: mind-assistant-timeweb-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/mind-assistant'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: mind-assistant-production
      url: https://cj999935.tw1.ru/mind-assistant/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Publish verified artifact and wait for Timeweb
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/memo/scripts/publish-artifact.mjs
