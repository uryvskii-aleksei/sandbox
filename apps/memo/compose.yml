name: sandbox-mind-assistant
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mindassistant}
      MYSQL_USER: ${DB_USER:-mindassistant}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Запустите npm run dev для создания локального .env}
      MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD, mysqladmin, ping, --silent, -h, localhost]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped
  api:
    build:
      context: ./backend
      args:
        PHP_VERSION: ${PHP_VERSION:-8.4}
    ports:
      - '127.0.0.1:${API_PORT:-8081}:80'
    environment:
      APP_ENV: development
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-mindassistant}
      DB_USER: ${DB_USER:-mindassistant}
      DB_PASSWORD: ${DB_PASSWORD:?Нужен локальный .env}
    volumes:
      - ./backend:/var/www/memo:ro
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost/api/health]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  mysql-data:
