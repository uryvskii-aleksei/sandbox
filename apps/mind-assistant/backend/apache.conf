<VirtualHost *:80>
    DocumentRoot /var/www/mind-assistant/public
    <Directory /var/www/mind-assistant/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
